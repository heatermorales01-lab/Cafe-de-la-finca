<style>
  :root{--cafe:#3b2418;--verde:#2f6b3c;--crema:#f7f1e8;--borde:#e0d4c3;--rojo:#a33a2a;--gris:#6f6259}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--crema);color:#241a14;font-size:16px;
       padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  [hidden]{display:none!important}
  header{background:var(--cafe);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:1.25rem}
  main{max-width:640px;margin:0 auto;padding:12px}
  .card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}
  .fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .nombre{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
  .sub{color:var(--gris);font-size:.9rem}
  input{width:100%;min-height:48px;border:1px solid var(--borde);border-radius:10px;padding:8px 12px;font-size:1rem;background:#fff}
  button{min-height:48px;border:0;border-radius:10px;padding:8px 14px;font-size:1rem;font-weight:600;cursor:pointer;
         background:var(--verde);color:#fff;touch-action:manipulation}
  button.sec{background:#eee5d8;color:var(--cafe)}
  button.link{background:none;color:var(--rojo);min-height:40px;padding:4px}
  header button{background:rgba(255,255,255,.15);min-height:40px}
  button:disabled{opacity:.45}
  .pasos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .paso label{display:block;text-align:center;color:var(--gris);font-size:.85rem;margin-bottom:4px}
  .paso div{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center}
  .paso button{font-size:1.5rem;padding:0}
  .paso output{font-size:1.35rem;font-weight:700}
  .cambiado{border:2px solid #d89a2b}
  .grande{font-size:1.5rem;font-weight:800;color:var(--verde);white-space:nowrap}
  .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0;text-align:center;font-size:.85rem}
  .dias span{background:var(--crema);border-radius:6px;padding:4px 0}
  .dias small{display:block;color:var(--gris)}
  .pagado{color:var(--verde);font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borde);display:grid;
      grid-template-columns:repeat(3,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:6px}
  nav button{background:none;color:var(--gris)}
  nav button.activo{background:var(--cafe);color:#fff}
  #barra{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto}
  #barra button{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #aviso{position:fixed;top:10px;left:12px;right:12px;max-width:616px;margin:0 auto;background:#241a14;color:#fff;
         padding:12px;border-radius:10px;text-align:center;z-index:5}
  form{display:grid;gap:10px}
  #inicio{z-index:4;min-height:100vh;min-height:100dvh;position:fixed;inset:0;overflow:auto;background:var(--cafe);display:flex;flex-direction:column;
          justify-content:center;align-items:center;gap:28px;padding:20px}
  #inicio img{width:100%;max-width:560px;border-radius:14px}
  #entrar{width:100%;max-width:560px;min-height:64px;font-size:1.4rem}
</style>
</head>

<header>
  <h1>☕ Café de la Finca</h1>
  <button id="salir" hidden>Inicio</button>
</header>
<div id="aviso" role="status" hidden></div>

<main>
  <section id="login" class="card" hidden>
    <form id="fLogin">
      <p>Solo la primera vez en este celular:</p>
      <input id="correo" type="email" placeholder="Correo" autocomplete="username" required>
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button>Entrar</button>
    </form>
  </section>

  <section id="app" hidden>
    <div id="vDia">
      <div class="card">
        <div class="fila">
          <button class="sec" data-dia="-1" aria-label="Día anterior">◀</button>
          <input id="fecha" type="date" aria-label="Fecha">
          <button class="sec" data-dia="1" aria-label="Día siguiente">▶</button>
        </div>
        <p class="sub" id="infoDia" style="margin-top:8px;text-align:center"></p>
      </div>
      <div id="listaDia"></div>
    </div>

    <div id="vSemana" hidden>
      <div class="card fila">
        <button class="sec" data-semana="-7" aria-label="Semana anterior">◀</button>
        <strong id="rango" style="text-align:center"></strong>
        <button class="sec" data-semana="7" aria-label="Semana siguiente">▶</button>
      </div>
      <div class="card" id="totales"></div>
      <div id="listaSemana"></div>
    </div>

    <div id="vAjustes" hidden>
      <div class="card">
        <form id="fPrecio">
          <strong>Precio de la cajuela (₡)</strong>
          <p class="sub" id="infoPrecio"></p>
          <input id="precio" type="number" inputmode="numeric" min="1" step="1" required>
          <button>Guardar precio</button>
        </form>
      </div>
      <div class="card">
        <form id="fTrab">
          <strong>Agregar trabajador</strong>
          <input id="nuevo" placeholder="Nombre" maxlength="60" required>
          <button>Agregar</button>
        </form>
      </div>
      <div class="card" id="listaTrab"></div>
      <button class="link" id="cerrar">Cerrar sesión en este celular</button>
    </div>
  </section>
</main>

<div id="barra" hidden><button id="guardar">Guardar cambios</button></div>
<nav id="nav" hidden>
  <button data-vista="Dia" class="activo">📝 Anotar</button>
  <button data-vista="Semana">💰 Semana</button>
  <button data-vista="Ajustes">⚙️ Ajustes</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== CONFIGURACIÓN: pegá aquí los datos de tu proyecto de Supabase =====
const SUPABASE_URL = "https://lwqpazhjoyibwiyioxqd.supabase.co";
const SUPABASE_KEY = "sb_publishable_E6-KpObgn7SNL_cjosFsRw_kPMZ6iPG";   // NUNCA la service_role / secret
// ==========================================================================

const $ = id => document.getElementById(id);
let db, vista = "Dia", ocupado = false;
let trabajadores = [], registros = [], pagos = [], precios = [];
let borrador = {};   // cambios sin guardar: { idTrabajador: cantidad }

// ---- fechas (en hora local) ----
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const aFecha = s => new Date(s + "T12:00:00");
const sumar = (s,n) => { const d = aFecha(s); d.setDate(d.getDate()+n); return iso(d); };
const lunes = s => sumar(s, -((aFecha(s).getDay()+6)%7));
const corta = s => aFecha(s).toLocaleDateString("es-CR",{day:"numeric",month:"short"});
let fecha = iso(new Date());

// ---- utilidades ----
const colones = n => "₡" + Math.round(n).toLocaleString("es-CR");
const num = n => n.toLocaleString("es-CR",{maximumFractionDigits:2});
const esc = t => t.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const precioDe = semana => Number(precios.filter(p => p.desde <= semana).at(-1)?.precio ?? 2000);
let reloj;
function aviso(t){ $("aviso").textContent = t; $("aviso").hidden = false; clearTimeout(reloj); reloj = setTimeout(()=>$("aviso").hidden = true, 3500); }
function revisar({data,error}){ if(error) throw error; return data; }
const hayCambios = () => Object.keys(borrador).length > 0;
const descartar = () => !hayCambios() || (confirm("Hay datos sin guardar. ¿Descartarlos?") && (borrador = {}, true));

// Ejecuta una acción evitando toques dobles y mostrando errores
async function accion(fn){
  if(ocupado) return;
  ocupado = true;
  try { await fn(); }
  catch(e){ console.error(e); aviso("Error: " + (e.message || "revisá la conexión")); }
  finally { ocupado = false; }
}

async function cargar(){
  const ini = lunes(fecha), fin = sumar(ini,6);
  const [t,r,p,pr] = await Promise.all([
    db.from("trabajadores").select("*").order("nombre"),
    db.from("recolecciones").select("*").gte("fecha",ini).lte("fecha",fin),
    db.from("pagos").select("*").eq("semana",ini),
    db.from("precios").select("*").order("desde")
  ]);
  trabajadores = revisar(t); registros = revisar(r); pagos = revisar(p); precios = revisar(pr);
  pintar();
}

const guardadoDia = id => Number(registros.find(r => r.trabajador_id === id && r.fecha === fecha)?.cantidad ?? 0);
const valorDia = id => borrador[id] ?? guardadoDia(id);
// Trabajadores visibles: activos, o inactivos que tienen datos en lo que se está viendo
const visibles = regs => trabajadores.filter(t => t.activo || regs.some(r => r.trabajador_id === t.id));

function paso(id, etiqueta, texto, delta, total){
  return `<div class="paso"><label>${etiqueta}</label><div>
    <button class="sec" data-id="${id}" data-delta="${-delta}" ${total < delta ? "disabled":""} aria-label="Restar ${etiqueta}">−</button>
    <output>${texto}</output>
    <button data-id="${id}" data-delta="${delta}" aria-label="Sumar ${etiqueta}">+</button></div></div>`;
}

function pintar(){
  const semana = lunes(fecha), precio = precioDe(semana);
  ["Dia","Semana","Ajustes"].forEach(v => $("v"+v).hidden = v !== vista);
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("activo", b.dataset.vista === vista));

  // ANOTAR
  $("fecha").value = fecha;
  const delDia = visibles(registros.filter(r => r.fecha === fecha));
  const totalDia = delDia.reduce((s,t) => s + valorDia(t.id), 0);
  $("infoDia").textContent = `${aFecha(fecha).toLocaleDateString("es-CR",{weekday:"long",day:"numeric",month:"long"})} · Total del día: ${num(totalDia)} cajuelas`;
  $("listaDia").innerHTML = delDia.map(t => {
    const v = valorDia(t.id), enteras = Math.floor(v), cuartos = v - enteras;
    return `<div class="card ${t.id in borrador ? "cambiado":""}">
      <div class="fila"><span class="nombre">${esc(t.nombre)}</span><span class="sub">${num(v)} caj. · ${colones(v*precio)}</span></div>
      <div class="pasos">${paso(t.id,"Cajuelas",enteras,1,v)}${paso(t.id,"Cuartos",num(cuartos),0.25,v)}</div></div>`;
  }).join("") || `<div class="card">Agregá trabajadores en ⚙️ Ajustes.</div>`;
  $("barra").hidden = !(vista === "Dia" && hayCambios());

  // SEMANA
  $("rango").textContent = `${corta(semana)} – ${corta(sumar(semana,6))}`;
  let sumaCaj = 0, sumaTotal = 0, sumaPend = 0;
  const conPagos = visibles([...registros, ...pagos]);
  $("listaSemana").innerHTML = conPagos.map(t => {
    const dias = [0,1,2,3,4,5,6].map(i => Number(registros.find(r => r.trabajador_id === t.id && r.fecha === sumar(semana,i))?.cantidad ?? 0));
    const caj = dias.reduce((a,b) => a+b, 0), total = caj*precio;
    const pago = pagos.find(p => p.trabajador_id === t.id);
    const pagado = Number(pago?.monto ?? 0), pend = total - pagado;
    sumaCaj += caj; sumaTotal += total; sumaPend += Math.max(pend,0);
    let estado = "";
    if(pago) estado = `<p class="pagado">✔ Pagado ${colones(pagado)}</p>` +
      (pend > 0 ? `<p>Falta pagar <b>${colones(pend)}</b></p>` : pend < 0 ? `<p>Se pagó ${colones(-pend)} de más</p>` : "") +
      `<button class="link" data-anular="${t.id}">Anular pago</button>`;
    const boton = pend > 0 ? `<button style="width:100%;margin-top:6px" data-pagar="${t.id}" data-monto="${total}" data-caj="${caj}">Marcar como pagado</button>` : "";
    return `<div class="card">
      <div class="fila"><div><div class="nombre">${esc(t.nombre)}</div><div class="sub">${num(caj)} cajuelas</div></div><span class="grande">${colones(total)}</span></div>
      <div class="dias">${["L","K","M","J","V","S","D"].map((d,i) => `<span><small>${d}</small>${dias[i] ? num(dias[i]) : "–"}</span>`).join("")}</div>
      ${estado}${boton}</div>`;
  }).join("") || `<div class="card">Sin trabajadores todavía.</div>`;
  $("totales").innerHTML = `<div class="fila"><span>Total de la semana<br><span class="sub">${num(sumaCaj)} cajuelas a ${colones(precio)}</span></span><span class="grande">${colones(sumaTotal)}</span></div>
    <div class="fila" style="margin-top:8px"><span>Pendiente de pagar</span><strong>${colones(sumaPend)}</strong></div>`;

  // AJUSTES
  $("infoPrecio").textContent = `Actual: ${colones(precio)}. El cambio aplica desde la semana del ${corta(semana)} en adelante (hasta el siguiente cambio registrado).`;
  if(document.activeElement !== $("precio")) $("precio").value = precio;
  $("listaTrab").innerHTML = "<strong>Trabajadores</strong>" + trabajadores.map(t =>
    `<div class="fila" style="margin-top:10px"><span>${esc(t.nombre)}${t.activo ? "" : " <span class='sub'>(inactivo)</span>"}</span>
     <button class="sec" data-activo="${t.id}">${t.activo ? "Desactivar" : "Activar"}</button></div>`).join("");
}

async function irA(nueva){
  if(!nueva || !descartar()) { $("fecha").value = fecha; return; }
  const anterior = fecha;
  fecha = nueva;
  try { await cargar(); } catch(e){ fecha = anterior; pintar(); throw e; }
}

// ---- eventos ----
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  const d = b.dataset;
  if(d.delta){                       // sumar / restar (0,75 + 0,25 pasa a 1 cajuela)
    if(ocupado) return;
    const id = Number(d.id), v = Math.max(0, valorDia(id) + Number(d.delta));
    if(v === guardadoDia(id)) delete borrador[id]; else borrador[id] = v;
    pintar();
  }
  else if(d.vista){ vista = d.vista; pintar(); scrollTo(0,0); }
  else if(d.dia) accion(() => irA(sumar(fecha, Number(d.dia))));
  else if(d.semana) accion(() => irA(sumar(fecha, Number(d.semana))));
  else if(d.pagar){
    if(hayCambios()) return aviso("Primero guardá los cambios en Anotar");
    const t = trabajadores.find(t => t.id === Number(d.pagar));
    if(confirm(`¿Marcar la semana de ${t.nombre} como pagada (${colones(Number(d.monto))})?`))
      accion(async () => {
        revisar(await db.from("pagos").upsert({trabajador_id:t.id, semana:lunes(fecha), cajuelas:Number(d.caj), monto:Number(d.monto)}, {onConflict:"trabajador_id,semana"}));
        await cargar();
      });
  }
  else if(d.anular){
    if(confirm("¿Anular este pago?")) accion(async () => {
      revisar(await db.from("pagos").delete().eq("trabajador_id",Number(d.anular)).eq("semana",lunes(fecha)));
      await cargar();
    });
  }
  else if(d.activo) accion(async () => {
    const t = trabajadores.find(t => t.id === Number(d.activo));
    revisar(await db.from("trabajadores").update({activo:!t.activo}).eq("id",t.id));
    await cargar();
  });
});

$("fecha").addEventListener("change", e => accion(() => irA(e.target.value)));

$("guardar").addEventListener("click", () => accion(async () => {
  $("guardar").disabled = true;
  try {
    const filas = Object.entries(borrador).map(([id,cantidad]) => ({trabajador_id:Number(id), fecha, cantidad}));
    // Un 0 también se guarda: así se corrige un dato anotado por error
    revisar(await db.from("recolecciones").upsert(filas, {onConflict:"trabajador_id,fecha"}));
    borrador = {};
    await cargar();
    aviso("✔ Guardado");
  } finally { $("guardar").disabled = false; }
}));

$("fPrecio").addEventListener("submit", e => { e.preventDefault(); accion(async () => {
  const precio = Number($("precio").value);
  if(!confirm(`¿Usar ${colones(precio)} por cajuela desde la semana del ${corta(lunes(fecha))}?`)) return;
  revisar(await db.from("precios").upsert({desde:lunes(fecha), precio}, {onConflict:"desde"}));
  await cargar();
  aviso("✔ Precio actualizado");
});});

$("fTrab").addEventListener("submit", e => { e.preventDefault(); accion(async () => {
  const nombre = $("nuevo").value.trim();
  if(!nombre) return;
  revisar(await db.from("trabajadores").insert({nombre}));
  $("nuevo").value = "";
  await cargar();
  aviso("✔ Trabajador agregado");
});});

$("fLogin").addEventListener("submit", e => { e.preventDefault(); accion(async () => {
  revisar(await db.auth.signInWithPassword({email:$("correo").value.trim(), password:$("clave").value}));
  $("clave").value = "";
  await entrar();
});});

$("salir").addEventListener("click", () => { $("inicio").hidden = false; });   // los cambios sin guardar se conservan
$("cerrar").addEventListener("click", () => {
  if(confirm("¿Cerrar sesión? Se pedirá la contraseña para volver a entrar.") && descartar())
    accion(async () => { await db.auth.signOut(); location.reload(); });
});
$("entrar").addEventListener("click", () => accion(async () => {
  if(!db) return aviso("No se pudo conectar. Revisá el internet y volvé a abrir la página.");
  const { session } = revisar(await db.auth.getSession());
  $("inicio").hidden = true;
  if(session) await entrar();
  else { $("app").hidden = $("nav").hidden = $("salir").hidden = $("barra").hidden = true; $("login").hidden = false; }
}));
addEventListener("beforeunload", e => { if(hayCambios()){ e.preventDefault(); e.returnValue = ""; } });

async function entrar(){
  $("login").hidden = true;
  $("app").hidden = $("nav").hidden = $("salir").hidden = false;
  await cargar();
}

(async () => {
  if(SUPABASE_URL.includes("TU-PROYECTO")) return aviso("Falta configurar Supabase en index.html");
  if(!window.supabase) return aviso("No se pudo cargar Supabase. Revisá el internet.");
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
})();
</script>
</body>
</html>
